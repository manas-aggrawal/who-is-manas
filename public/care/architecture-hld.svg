<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <marker id="aG" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#12A150" opacity="0.75"/>
    </marker>
    <marker id="aK" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#8b8173"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#f6f1e7"/>

  <!-- ================= group containers ================= -->
  <rect x="110" y="104" width="560" height="96" rx="14" fill="rgba(18,161,80,0.035)" stroke="#12A150" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="128" y="124" font-size="10" letter-spacing="1.2" fill="#8b8173">AWS EDGE — CLOUDFRONT</text>

  <rect x="90" y="238" width="470" height="420" rx="14" fill="rgba(18,161,80,0.035)" stroke="#12A150" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="108" y="258" font-size="10" letter-spacing="1.2" fill="#8b8173">AWS VPC — MULTI-AZ</text>

  <rect x="115" y="278" width="420" height="102" rx="10" fill="none" stroke="rgba(20,15,10,0.2)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="130" y="296" font-size="9.5" letter-spacing="1" fill="#8b8173">PUBLIC SUBNETS</text>

  <rect x="115" y="398" width="420" height="242" rx="10" fill="none" stroke="rgba(20,15,10,0.2)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="130" y="416" font-size="9.5" letter-spacing="1" fill="#8b8173">PRIVATE SUBNETS</text>

  <rect x="610" y="238" width="260" height="210" rx="14" fill="rgba(18,161,80,0.035)" stroke="#12A150" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="628" y="258" font-size="10" letter-spacing="1.2" fill="#8b8173">OBSERVABILITY</text>

  <!-- ================= connectors ================= -->
  <!-- clients -> cloudfront -->
  <line x1="185" y1="78" x2="238" y2="132" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <line x1="435" y1="78" x2="285" y2="132" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <!-- cloudfront -> s3 -->
  <line x1="355" y1="158" x2="448" y2="158" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <text x="360" y="150" font-size="9.5" fill="#8b8173">default &#8594; SPA</text>
  <!-- cloudfront -> ALB -->
  <line x1="246" y1="184" x2="240" y2="306" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <text x="255" y="250" font-size="9.5" fill="#4b453c">/api/* &#183; strip prefix</text>
  <!-- ALB -> ECS -->
  <line x1="240" y1="356" x2="243" y2="434" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <!-- ECS -> RDS -->
  <line x1="245" y1="512" x2="245" y2="538" stroke="#12A150" stroke-width="1.5" opacity="0.7" marker-end="url(#aG)"/>
  <text x="258" y="530" font-size="9.5" fill="#4b453c">SQL + PostGIS</text>
  <!-- ECS -> NAT -> external -->
  <line x1="345" y1="452" x2="378" y2="358" stroke="#8b8173" stroke-width="1.3" opacity="0.75" marker-end="url(#aK)"/>
  <line x1="452" y1="356" x2="648" y2="512" stroke="#8b8173" stroke-width="1.3" opacity="0.75" marker-end="url(#aK)"/>
  <!-- ECS -> OTel collector -->
  <line x1="345" y1="462" x2="628" y2="300" stroke="#8b8173" stroke-width="1.3" opacity="0.75" marker-end="url(#aK)"/>
  <text x="452" y="368" font-size="9.5" fill="#8b8173">OTLP gRPC</text>
  <!-- ECS -> CloudWatch -->
  <line x1="345" y1="498" x2="628" y2="410" stroke="#8b8173" stroke-width="1.3" opacity="0.75" marker-end="url(#aK)"/>
  <text x="455" y="474" font-size="9.5" fill="#8b8173">stdout</text>
  <!-- OTel -> Honeycomb -->
  <line x1="740" y1="316" x2="740" y2="328" stroke="#8b8173" stroke-width="1.3" opacity="0.75" marker-end="url(#aK)"/>

  <!-- ================= client cards ================= -->
  <g>
    <rect x="90" y="24" width="190" height="54" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="185" y="46" font-size="12.5" font-weight="700" fill="#16120d" text-anchor="middle">User App</text>
    <text x="185" y="63" font-size="9.5" fill="#8b8173" text-anchor="middle">React Native &#183; mobile</text>
  </g>
  <g>
    <rect x="340" y="24" width="190" height="54" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="435" y="46" font-size="12.5" font-weight="700" fill="#16120d" text-anchor="middle">Admin Client</text>
    <text x="435" y="63" font-size="9.5" fill="#8b8173" text-anchor="middle">web SPA</text>
  </g>

  <!-- ================= edge cards ================= -->
  <g>
    <rect x="145" y="132" width="210" height="52" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="250" y="153" font-size="12.5" font-weight="700" fill="#12A150" text-anchor="middle">CloudFront</text>
    <text x="250" y="170" font-size="9.5" fill="#8b8173" text-anchor="middle">HTTPS &#183; redirect-to-https</text>
  </g>
  <g>
    <rect x="450" y="132" width="190" height="52" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="545" y="153" font-size="12.5" font-weight="700" fill="#12A150" text-anchor="middle">S3 — SPA assets</text>
    <text x="545" y="170" font-size="9.5" fill="#8b8173" text-anchor="middle">private via OAC</text>
  </g>

  <!-- ================= vpc cards ================= -->
  <g>
    <rect x="150" y="308" width="180" height="48" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="240" y="330" font-size="12" font-weight="700" fill="#12A150" text-anchor="middle">Application LB</text>
    <text x="240" y="346" font-size="9.5" fill="#8b8173" text-anchor="middle">public subnet entry</text>
  </g>
  <g>
    <rect x="360" y="308" width="150" height="48" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="435" y="330" font-size="12" font-weight="700" fill="#12A150" text-anchor="middle">NAT Gateway</text>
    <text x="435" y="346" font-size="9.5" fill="#8b8173" text-anchor="middle">egress only</text>
  </g>
  <g>
    <rect x="150" y="436" width="190" height="76" rx="10" fill="#ffffff" stroke="#12A150" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="245" y="466" font-size="12.5" font-weight="700" fill="#12A150" text-anchor="middle">ECS Fargate</text>
    <text x="245" y="484" font-size="9.5" fill="#4b453c" text-anchor="middle">care-api &#183; NestJS</text>
    <text x="245" y="500" font-size="9" fill="#8b8173" text-anchor="middle">stateless &#183; awsvpc</text>
  </g>
  <g>
    <rect x="150" y="540" width="190" height="76" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="245" y="570" font-size="12.5" font-weight="700" fill="#12A150" text-anchor="middle">RDS PostgreSQL</text>
    <text x="245" y="588" font-size="9.5" fill="#4b453c" text-anchor="middle">+ PostGIS</text>
    <text x="245" y="604" font-size="9" fill="#8b8173" text-anchor="middle">private subnet</text>
  </g>

  <!-- ================= observability cards ================= -->
  <g>
    <rect x="630" y="274" width="220" height="42" rx="9" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.3"/>
    <text x="740" y="300" font-size="11.5" font-weight="700" fill="#16120d" text-anchor="middle">OTel Collector</text>
  </g>
  <g>
    <rect x="630" y="330" width="220" height="42" rx="9" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.3"/>
    <text x="740" y="356" font-size="11.5" font-weight="700" fill="#16120d" text-anchor="middle">Honeycomb</text>
  </g>
  <g>
    <rect x="630" y="386" width="220" height="42" rx="9" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.3"/>
    <text x="740" y="412" font-size="11.5" font-weight="700" fill="#16120d" text-anchor="middle">CloudWatch Logs</text>
  </g>

  <!-- ================= external services ================= -->
  <g>
    <rect x="610" y="506" width="260" height="64" rx="10" fill="#ffffff" stroke="rgba(20,15,10,0.16)" stroke-width="1.4"/>
    <text x="740" y="533" font-size="12.5" font-weight="700" fill="#16120d" text-anchor="middle">External services</text>
    <text x="740" y="551" font-size="9.5" fill="#8b8173" text-anchor="middle">SES (email) &#183; Geocoding</text>
  </g>
</svg>
